# Exceptions to the generic suffix/prefix split.
base_overrides:
  egg yolk: [egg, yolk]
  egg white: [egg, white]

# Suffix words that mark a processed form of a base ingredient ("garlic powder" -> base garlic, form powder).
form_suffixes: [powder, paste, juice, zest, extract, oil, flake, puree, syrup, seed, leaf, broth, vinegar, salt, sauce, rind, peel, bouillon, spread, jam, jelly, liqueur, wine, sprout]
# Prefix words marking a processed form ("dried thyme" -> base thyme, form dried).
form_prefixes: [dried, sun dried, smoked, pickled, candied, powdered]   # cooking states (roasted, toasted) are NOT forms

