   pumpkin, kale, lettuce, radish, asparagus, pea, lentil, chickpea, quinoa, oat, walnut, pecan, almond,
   beef, pork, turkey, chicken, ham, bacon, sausage, steak, tofu, tuna, salmon, scallop, clam, crabmeat, mustard, yogurt, tortilla, pasta, macaroni, cornmeal, raisin, honey, molasses, arugula, yeast, marshmallow, breadcrumb, peanut, olive, cheese, bread, chocolate, rum, vodka, tequila, whiskey, brandy, beer, sherry, coffee, gelatin, salsa, paprika, mayonnaise, pickle, cracker, shortening, bitters, baguette, coconut]

# Parents whose members are treated as INTERCHANGEABLE when matching what the user has (an onion is an
# onion whatever its colour). Deliberately smaller than head_parents: cheese, oil or wine are not
# interchangeable, so 'I have cheese' must not satisfy 'feta'.
interchangeable:
  [onion, garlic, tomato, potato, carrot, celery, lemon, lime, orange, apple, banana, mushroom, spinach,
   cabbage, broccoli, cauliflower, zucchini, cucumber, egg, shrimp, ginger, parsley, cilantro, basil, mint,
   thyme, rosemary, sage, oregano, dill, chive, shallot, leek, avocado, strawberry, blueberry, raspberry,
