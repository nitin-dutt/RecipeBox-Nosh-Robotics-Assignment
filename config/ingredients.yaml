  [onion, garlic, tomato, potato, carrot, celery, lemon, lime, orange, apple, banana, mushroom, spinach,
   cabbage, broccoli, cauliflower, zucchini, cucumber, egg, shrimp, ginger, parsley, cilantro, basil, mint,
   thyme, rosemary, sage, oregano, dill, chive, shallot, leek, avocado, strawberry, blueberry, raspberry,
