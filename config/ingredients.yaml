# Ingredient lexicon: curated, reviewable data that drives the parser (domain/ingredient.py).
# Everything is lowercase, accent-folded, hyphens written as spaces, singular.
# Changing this file changes parsing; the unit tests and audit script show the effect.

# Multi-word descriptors that are removed before tokenising.
