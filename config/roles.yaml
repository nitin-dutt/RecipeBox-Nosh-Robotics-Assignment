# short text about what a substitute ADDS (also a prediction)
adds:
  applesauce: adds moisture and mild sweetness, with some binding but little lift
  banana: adds moisture, sweetness and banana flavour, with some binding
  mashed banana: adds moisture, sweetness and banana flavour, with some binding
  silken tofu: adds smooth body and binding with almost no flavour
  yogurt: adds moisture and tang
  coconut milk: adds richness and a noticeable coconut flavour
  coconut cream: adds richness and a noticeable coconut flavour
  almond milk: adds liquid but little richness
  soy milk: adds liquid but little richness
  oat milk: adds liquid, little richness
  vegetable oil: adds fat and moisture with no flavour
  olive oil: adds fat and moisture with a fruity flavour
  coconut oil: adds fat, solid when cool, with a coconut flavour
  margarine: behaves like butter in most baking
  flaxseed: binds when mixed with water, with a nutty taste
  chia seed: binds when mixed with water
  vinegar: reacts with baking soda to give some lift
  baking soda: gives lift when combined with an acid
  cashew: when blended, gives creaminess
  peanut butter: adds fat, binding and a strong nutty flavour
  almond butter: adds fat, binding and a nutty flavour
  tahini: adds fat, binding and a sesame flavour
