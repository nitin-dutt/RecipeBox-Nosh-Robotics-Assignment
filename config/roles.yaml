# Culinary ROLE knowledge used by the substitution tool.
#
# THIS IS GENERAL KNOWLEDGE, NOT DATASET EVIDENCE. The tool uses it for exactly two things, and always labels it as such:
#   1. a compatibility check: a substitute should be able to do (at least part of) the job of the ingredient it replaces;
#   2. the "expected effects" text, which is always presented as a PREDICTION, never as a verified outcome.
# Names are canonical ingredient names (see ingredient_vocab). Unknown ingredients simply have no entry: the tool then says
# "role not documented" and relies on the recipe evidence alone.

role_labels:
  binder: holds the mixture together
  leavening: gives lift and an airy crumb
  moisture: keeps the result moist
  richness: adds richness and a smooth mouthfeel
  fat: adds fat for tenderness and browning
  sweetness: adds sweetness
  structure: gives body and structure
  thickener: thickens a sauce or batter
  liquid: provides liquid
  acid: adds tang or acidity
  flavor: adds its own distinctive flavour
  crunch: adds crunch
  umami: adds savoury depth

# what is typically lost if a role is NOT covered (written as a prediction)
loss_effects:
  binder: the mixture may hold together less well and crumble or fall apart
  leavening: less lift, so a denser, flatter result
  moisture: a drier result
  richness: less rich and a lighter, thinner mouthfeel
  fat: less tender, with less browning
  sweetness: less sweet
  structure: a softer, less structured texture
  thickener: a thinner sauce or batter
  liquid: less liquid, so you may need to add some
  acid: a flatter, less bright taste
  flavor: the dish loses that characteristic flavour
  crunch: less crunch
  umami: less savoury depth

