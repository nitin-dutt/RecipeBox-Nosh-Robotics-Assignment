# Restriction taxonomy. Applied to the CANONICAL ingredient name (lowercase, accent-folded, singular).
#
# For each class:
#   terms        -> status "yes":   the ingredient contains/is the restricted item
#   maybe_terms  -> status "maybe": commonly contains it, or may; text alone cannot settle it
#   guards       -> phrases removed from the name BEFORE matching (e.g. "coconut milk" is not dairy)
#   exempt       -> if the name contains one of these phrases, the class never applies ("dairy free cheese")
#   includes     -> union with other classes (meat = pork + beef + poultry + lamb + game + own terms)
#
#   demote       -> phrases that never count as "yes" but still count as "maybe" (e.g. spice blends)
#
# Matching is whole-word, so "butternut squash" is not "butter" and "eggplant" is not "egg".
# This is a text-only classification: it never certifies anything as safe. A recipe with no hit is only
# "no restricted ingredient found in the ingredient text".

# Regexes applied to the (normalised, lowercase) INSTRUCTION text before scanning it for restricted terms. They remove
# ingredient words used as verbs, shapes, colours or equipment, e.g. "cream the shortening", "walnut sized balls".
instruction_guards:
  - '\b\w+ sized?\b'
  - '\b\w+ shaped?\b'
  # remove only the verb, never the real ingredient next to it: "cream butter and brown sugar" keeps its butter
  - '\bcream(?= (?:the|together|until|shortening|with|butter and)\b)'
  - '\bcheese ?cloth\b'
  - '\bto toast\b'
  - '\btoast(?= (?:the|until|in|on|over|them|it|nuts?|walnuts?|pecans?|almonds?|seeds?|spices?|coconut|sesame|pine|hazelnuts?|cumin|rice|oats?|flour|pumpkin|sunflower|chopped|whole|slivered)\b)'
  - '\bcolou?r of (a |an |the )?\w+( \w+)?'
  - '\b(?:\w+ ){1,2}brown\b(?! (?:sugar|rice|butter|mustard|bread|lentil|flour|gravy|sauce|ale|bean))'

