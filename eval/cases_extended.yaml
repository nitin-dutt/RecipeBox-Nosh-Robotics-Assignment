# Extended deterministic cases (phase 10). Same rules as cases.yaml: scripted plans, no LLM, independent checks (raw-text regexes,
# direct SQL, independent arithmetic). New here: per-turn checks, planner FAULT injection (the scripted planner is deliberately
# wrong, the code guards must repair it), combinations of restrictions, vegetarian mode, follow-up chains, scaling and taste.
# `category` groups the report. `web: fake` gives the case a canned web searcher; otherwise web search is off.

# ===================================================================================== restrictions: combinations
- id: R1-no-dairy-and-no-egg-cake
  task: 1
  category: restrictions
  why: "Two classes at once: nothing shown may contain either (independent text check)."
  turns:
    - say: "Cake recipes with no dairy and no eggs"
      plan: {intent: search, scope: new, query: cake, add_exclude_classes: [dairy, egg]}
  checks:
    - min_sources: 3
    - no_violations: dairy
    - no_violations: egg
    - no_safety_claim: {}

