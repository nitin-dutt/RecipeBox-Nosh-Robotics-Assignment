    - say: "Dairy is fine now"
      plan: {intent: search, remove_exclude_classes: [dairy]}
      checks: [{filter_absent: {key: exclude_classes, value: dairy}}, {min_sources: 3}]

- id: R15-three-step-refinement
  task: 1
  category: follow-ups
  why: "Each follow-up is a diff on the filters; all of them must still hold at the end."
  turns:
    - say: "Show me muffin recipes"
      plan: {intent: search, scope: new, query: muffin}
    - say: "No egg"
      plan: {intent: search, add_exclude_classes: [egg]}
      checks: [{no_violations: egg}]
    - say: "No dairy either"
      plan: {intent: search, add_exclude_classes: [dairy]}
      checks: [{no_violations: dairy}]
    - say: "At most 8 steps"
      plan: {intent: search, max_steps: 8}
  checks:
    - min_sources: 2
    - no_violations: egg
    - no_violations: dairy
    - steps_at_most: 8
    - active_filter: {key: exclude_classes, value: egg}
    - active_filter: {key: exclude_classes, value: dairy}
    - active_filter: {key: query, value: muffin}

