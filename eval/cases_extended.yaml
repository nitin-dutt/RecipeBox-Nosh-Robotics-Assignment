# ===================================================================================== allergen guard (found by the user: grapes)
- id: R9-grape-allergy-planner-correct
  task: 1
  category: allergen-guard
  turns:
    - say: "Fruit salad recipes, I'm allergic to grapes"
      plan: {intent: search, scope: new, query: fruit salad, add_exclude: [grapes]}
  checks:
    - min_sources: 3
    - no_word: [grape]
    - no_safety_claim: {}

- id: R10-grape-allergy-planner-WRONG
  task: 1
  category: allergen-guard
  why: "The user's bug: the planner answered 'no egg' for 'allergic to grapes'. The code must drop the unsupported class and exclude grapes."
  turns:
    - say: "Show me fruit salad recipes"
      plan: {intent: search, scope: new, query: fruit salad}
    - say: "I'm allergic to grapes"
      plan: {intent: search, add_exclude_classes: [egg]}
      checks:
        - no_word: [grape]
        - min_sources: 2
        - filter_absent: {key: exclude_classes, value: egg}
        - active_filter: {key: exclude_ingredients, value: grapes}
        - trace_has: {path: allergen_guard.classes_dropped, value: [egg]}
        - no_safety_claim: {}

