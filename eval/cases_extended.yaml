# ===================================================================================== faults found in the phase 10 extension (kept as regression cases)
- id: R21-count-follow-up-the-planner-forgets-vegetarian
  task: 1
  category: allergen-guard
  why: "Found by a real conversation: for 'how many of those are vegetarian?' the planner returned a bare count, and the answer silently counted ALL recipes."
  turns:
    - say: "How many recipes use both tomato and basil?"
      plan: {intent: count, scope: new, add_include: [tomato, basil]}
    - say: "and how many of those are vegetarian?"
      plan: {intent: count}
  checks:
    - active_filter: {key: exclude_classes, value: vegetarian}
    - active_filter: {key: include_ingredients, value: tomato}
    - has_calculation: {}

- id: R22-planner-refuses-a-request-that-asks-to-confirm-safety
  task: 1
  category: allergen-guard
  why: "Found by a real conversation: 'show me cookies and confirm they are safe' was refused whole. The recipes are answered; the certification is declined in words."
  turns:
    - say: "I have a nut allergy, show me cookie recipes and confirm they are safe"
      plan: {intent: unsupported, unsupported_text: "confirm they are safe"}
  checks:
    - min_sources: 2
    - no_violations: tree_nut
    - no_violations: peanut
    - text_contains: "cannot confirm safety"
    - trace_has: {path: safety_request_converted, value: true}
    - no_safety_claim: {}

- id: V13-veg-mode-leaves-out-a-junk-parsed-egg-line
  task: 1
  category: vegetarian
  vegetarian: true
  why: "Found by the extended audit: 'Scrambled Eggs' passed the veg switch because its line was parsed to a junk name and flagged only as 'maybe egg'."
  turns:
    - say: "Scrambled eggs for an appetizer"
      plan: {intent: search, scope: new, query: scrambled, k: 10}
  checks:
    - no_violations: egg

- id: R23-vegan-asked-for-in-words
  task: 1
  category: allergen-guard
  turns:
    - say: "Show me dessert recipes"
      plan: {intent: search, scope: new, query: dessert}
    - say: "only vegan ones"
      plan: {intent: search}
  checks:
    - active_filter: {key: exclude_classes, value: vegan}
    - min_sources: 2

- id: T1k-planner-puts-the-ingredient-in-the-dish-query
  task: 1
  category: statistics
  why: "Found by a real conversation: 'recipes with tomato' came back as query=tomato, so the ranking looked at 5 relevant recipes instead of every tomato recipe."
  turns:
    - say: "Which 5 recipes with tomato have the fewest steps?"
      plan: {intent: rank_steps, scope: new, query: tomato, k: 5}
  checks:
    - min_sources: 5
    - steps_ascending: {}
    - trace_has: {path: query_moved_to_ingredient, value: tomato}
    - text_contains: "tie"

- id: T1l-fewest-steps-for-a-dish-name-is-really-sorted
  task: 1
  category: statistics
  why: "Hybrid retrieval ignores the sort order; the ranking is now done in code over a relevance pool and says so."
  turns:
    - say: "Which banana bread recipes have the fewest steps?"
      plan: {intent: rank_steps, scope: new, query: banana bread, k: 5}
  checks:
    - min_sources: 5
    - steps_ascending: {}
    - text_contains: "relevance pool"
