# Hand-labelled gold set for ingredient labeling (names are real parser outputs from the database).
#
# WHO WROTE THIS: the assistant, from food knowledge, BEFORE looking at the LLM output and independently of the rules.
# It is therefore independent of the two systems it scores, but NOT independent of its author: the project owner should
# spot-check ~30 random entries (any disagreement is a bug in this file, fix it and re-run the pilot).
#
# Fields: parent (broader everyday ingredient it truly IS a kind of; default = the name itself), is_ingredient (default true),
# classes: restriction class -> yes | maybe ; a class that is not listed means "does not apply".
# Policy used (same as the labeler prompt): coconut = tree_nut maybe; vanilla/other extracts = alcohol maybe; soy sauce =
# soy yes + gluten maybe; margarine/chocolate = dairy maybe; gelatin = pork/beef maybe; plant milks are not dairy.
