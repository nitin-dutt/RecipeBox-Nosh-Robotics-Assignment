[project]
name = "recipebot"
version = "0.1.0"
description = "Grounded recipe chatbot over the Recipe Box dataset"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.16.1",
  "duckdb>=1.1",
  "faiss-cpu>=1.15.1",
  "fastapi>=0.162.2",
  "fastembed>=0.9.1",
  "google-genai>=3.0.0",
  "httpx>=0.28.1",
  "numpy>=2.4.6",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "scipy>=1.17.1",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/recipebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
